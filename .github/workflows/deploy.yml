name: CI/CD Pipeline & Multi-Cloud Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Select deployment target cloud platform'
        required: true
        default: 'all-configured'
        type: choice
        options:
          - 'all-configured'
          - 'google-cloud-run'
          - 'aws-amplify'
          - 'aws-app-runner'
          - 'vercel'

env:
  PORT: 3000
  NODE_ENV: production
  BUILD_OUTPUT_DIR: dist

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Continuous Integration (Lint, Typecheck & Production Build Verification)
  # =========================================================================
  ci-build-and-test:
    name: 🧪 CI — Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Static Type Checking & Linting
        run: npm run lint

      - name: 🏗️ Execute Production Build
        run: npm run build
        env:
          NODE_ENV: ${{ env.NODE_ENV }}
          PORT: ${{ env.PORT }}

      - name: 📦 Verify Build Output Directory
        run: |
          if [ ! -d "${{ env.BUILD_OUTPUT_DIR }}" ] || [ ! -f "${{ env.BUILD_OUTPUT_DIR }}/index.html" ] || [ ! -f "${{ env.BUILD_OUTPUT_DIR }}/server.cjs" ]; then
            echo "❌ Error: Build output directory '${{ env.BUILD_OUTPUT_DIR }}' is incomplete."
            exit 1
          fi
          echo "✓ Verified build artifacts in ${{ env.BUILD_OUTPUT_DIR }}/"

      - name: 📦 Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ${{ env.BUILD_OUTPUT_DIR }}/
          retention-days: 7

  # =========================================================================
  # 2. Google Cloud Run Deployment
  # =========================================================================
  deploy-cloud-run:
    name: 🚀 Deploy to Google Cloud Run
    needs: [ci-build-and-test]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event.inputs.deploy_target == 'google-cloud-run' || github.event.inputs.deploy_target == 'all-configured' || github.event.inputs.deploy_target == null)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Authenticate with Google Cloud (Conditional)
        id: gcp-auth
        if: env.GCP_CREDENTIALS != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: 🛠️ Set up Cloud SDK
        if: steps.gcp-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Configure Docker & Deploy to Cloud Run
        if: steps.gcp-auth.outcome == 'success'
        run: |
          gcloud auth configure-docker
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/travelpilot:${{ github.sha }}
          gcloud run deploy travelpilot \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/travelpilot:${{ github.sha }} \
            --platform managed \
            --region ${{ secrets.GCP_REGION || 'us-central1' }} \
            --allow-unauthenticated \
            --port ${{ env.PORT }} \
            --set-env-vars NODE_ENV=production,PORT=${{ env.PORT }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: ℹ️ Google Cloud Run Status Notice
        if: steps.gcp-auth.outcome != 'success'
        run: |
          echo "ℹ️ Google Cloud Run deployment skipped: GCP_SA_KEY secret not configured."

  # =========================================================================
  # 3. AWS Amplify Deployment
  # =========================================================================
  deploy-aws-amplify:
    name: 🚀 Deploy to AWS Amplify
    needs: [ci-build-and-test]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event.inputs.deploy_target == 'aws-amplify' || github.event.inputs.deploy_target == 'all-configured' || github.event.inputs.deploy_target == null)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials (Conditional)
        id: aws-amplify-auth
        if: env.AWS_KEY != '' && env.AMPLIFY_APP_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AMPLIFY_APP_ID: ${{ secrets.AWS_AMPLIFY_APP_ID }}

      - name: 🚀 Trigger AWS Amplify Build & Deployment
        if: steps.aws-amplify-auth.outcome == 'success'
        run: |
          echo "Starting AWS Amplify Deployment Job..."
          aws amplify start-job \
            --app-id ${{ secrets.AWS_AMPLIFY_APP_ID }} \
            --branch-name ${{ github.ref_name }} \
            --job-type RELEASE

      - name: ℹ️ AWS Amplify Status Notice
        if: steps.aws-amplify-auth.outcome != 'success'
        run: |
          echo "ℹ️ AWS Amplify deployment skipped: AWS_AMPLIFY_APP_ID or AWS credentials not configured."

  # =========================================================================
  # 4. AWS App Runner / ECR Deployment
  # =========================================================================
  deploy-aws-runner:
    name: 🚀 Deploy to AWS App Runner / ECR
    needs: [ci-build-and-test]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event.inputs.deploy_target == 'aws-app-runner' || github.event.inputs.deploy_target == 'all-configured' || github.event.inputs.deploy_target == null)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials (Conditional)
        id: aws-auth
        if: env.AWS_KEY != '' && env.AWS_ACCOUNT != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: 🐳 Login to Amazon ECR & Push Image
        if: steps.aws-auth.outcome == 'success'
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION || 'us-east-1' }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION || 'us-east-1' }}.amazonaws.com
          docker build -t travelpilot:latest .
          docker tag travelpilot:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION || 'us-east-1' }}.amazonaws.com/travelpilot:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION || 'us-east-1' }}.amazonaws.com/travelpilot:latest

      - name: ℹ️ AWS Runner Status Notice
        if: steps.aws-auth.outcome != 'success'
        run: |
          echo "ℹ️ AWS Runner deployment skipped: AWS_ACCESS_KEY_ID or AWS_ACCOUNT_ID not configured."

  # =========================================================================
  # 5. Vercel Deployment
  # =========================================================================
  deploy-vercel:
    name: 🚀 Deploy to Vercel
    needs: [ci-build-and-test]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event.inputs.deploy_target == 'vercel' || github.event.inputs.deploy_target == 'all-configured' || github.event.inputs.deploy_target == null)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel (Conditional)
        id: vercel-deploy
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: ℹ️ Vercel Deployment Status Notice
        if: steps.vercel-deploy.outcome != 'success'
        run: |
          echo "ℹ️ Vercel deployment skipped: VERCEL_TOKEN secret not configured."
